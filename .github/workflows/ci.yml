name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell scripts
        run: |
          bash -n install.sh uninstall.sh launch.sh
          bash -n scripts/*.sh docker/entrypoint.sh
      - name: Compose file parses
        run: docker compose -f docker/docker-compose.yml config >/dev/null

  grok-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install grok-tui (offline tests)
        run: pip install -e "./grok-tui[dev]"
      - name: pytest grok-tui
        run: pytest grok-tui/tests
        env:
          XAI_API_KEY: ""
          GROK_API_KEY: ""
