[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bot-tui"
version = "0.7.2"
description = "Grok GUI TUI shell — companion client (not Grok)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0,<0.29",
    "prompt_toolkit>=3.0.43,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grok-bot-tui = "grok_bot_tui.__main__:main"
grok-tui-shell = "grok_bot_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grok_bot_tui = ["decrypt_session/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
