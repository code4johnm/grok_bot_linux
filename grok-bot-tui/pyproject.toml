[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-bot-tui"
version = "0.1.5"
description = "Grok Bot companion — launches packaged Electron grok-bot and official grok CLI (not a replacement)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0,<0.29",
    "prompt_toolkit>=3.0.43,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grok-bot-tui = "grok_bot_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
